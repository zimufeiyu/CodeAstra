<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img" aria-labelledby="title desc">
  <title id="title">CodeAstra 普通用户操作流程</title>
  <desc id="desc">从登录到查看审查结果的六步流程</desc>
  <rect width="1280" height="210" rx="24" fill="#f5f6f8"/>
  <g font-family="Microsoft YaHei, Arial, sans-serif" text-anchor="middle">
    <g fill="#202124">
      <rect x="40" y="55" width="160" height="100" rx="18" fill="#ffffff" stroke="#d9dde3"/>
      <text x="120" y="98" font-size="28" font-weight="700">1 登录</text><text x="120" y="130" font-size="17" fill="#68707c">进入工作区</text>
      <rect x="248" y="55" width="160" height="100" rx="18" fill="#ffffff" stroke="#d9dde3"/>
      <text x="328" y="98" font-size="28" font-weight="700">2 选模型</text><text x="328" y="130" font-size="17" fill="#68707c">8B / 32B</text>
      <rect x="456" y="55" width="160" height="100" rx="18" fill="#ffffff" stroke="#d9dde3"/>
      <text x="536" y="98" font-size="28" font-weight="700">3 加代码</text><text x="536" y="130" font-size="17" fill="#68707c">文件 / GitLab</text>
      <rect x="664" y="55" width="160" height="100" rx="18" fill="#ffffff" stroke="#d9dde3"/>
      <text x="744" y="98" font-size="28" font-weight="700">4 写要求</text><text x="744" y="130" font-size="17" fill="#68707c">说明关注点</text>
      <rect x="872" y="55" width="160" height="100" rx="18" fill="#ffffff" stroke="#d9dde3"/>
      <text x="952" y="98" font-size="28" font-weight="700">5 发审查</text><text x="952" y="130" font-size="17" fill="#68707c">等待完成</text>
      <rect x="1080" y="55" width="160" height="100" rx="18" fill="#202124"/>
      <text x="1160" y="98" font-size="28" font-weight="700" fill="#ffffff">6 看结果</text><text x="1160" y="130" font-size="17" fill="#dfe3e8">定位与导出</text>
    </g>
    <g fill="#8a929e" font-size="28"><text x="224" y="113">→</text><text x="432" y="113">→</text><text x="640" y="113">→</text><text x="848" y="113">→</text><text x="1056" y="113">→</text></g>
  </g>
</svg>
