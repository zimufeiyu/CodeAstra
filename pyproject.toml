[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-code-review"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "httpx",
  "pydantic>=2",
  "pydantic-settings",
  "tree-sitter==0.25.2",
  "tree-sitter-cpp==0.23.4",
  "uvicorn",
  "argon2-cffi",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/code_review"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live_ppu: requires two reachable SGLang/PPU endpoints",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".tools",
  "frontend/dist",
  "frontend/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["code_review"]
